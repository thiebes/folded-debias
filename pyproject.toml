[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "width-debias"
# The version lives in one place, width_debias.__version__.
dynamic = ["version"]
description = "Correction of the noise bias in fitted profile widths, for mean-squared-displacement (MSD) diffusion measurements."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Joseph J. Thiebes", email = "joseph@thiebes.org" },
]
keywords = ["diffusion", "mean-squared displacement", "bias correction",
            "contrast-to-noise ratio", "transient microscopy"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Physics",
]
# A library's metadata carries compatible ranges; the exact, hashed versions
# that produced the committed results are in uv.lock.
dependencies = [
    "numpy>=1.24,<3",
    "scipy>=1.10,<2",
]

[project.urls]
Source = "https://github.com/thiebes/width-debias"
Changelog = "https://github.com/thiebes/width-debias/blob/master/CHANGELOG.md"
Issues = "https://github.com/thiebes/width-debias/issues"

[project.optional-dependencies]
# fft-cnr supplies per-frame CNR estimates from single 1-D profiles.
# Used for real experimental data; the Monte Carlo validation knows true CNR.
# The real-data pipeline needs fft-cnr's refusal of degenerate
# generalized-Gaussian fits (commit 69cd361); 0.3.3 is the first PyPI release
# that carries it.
cnr = ["fft-cnr>=0.3.3,<0.5"]
# curved-text draws the curved data-series label on the poster figure.
plot = ["matplotlib>=3.7,<4", "curved-text>=0.5,<1"]
dev = ["pytest>=7.4", "matplotlib>=3.7,<4", "fft-cnr>=0.3.3,<0.5",
       "curved-text>=0.5,<1"]

[tool.setuptools.dynamic]
version = { attr = "width_debias.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
# Lock-only constraints: the environment that produced the committed results
# and poster figures. They do not enter the published metadata.
constraint-dependencies = [
    "numpy==2.4.5",
    "scipy==1.17.1",
    "matplotlib==3.10.9",
    "curved-text==0.5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
