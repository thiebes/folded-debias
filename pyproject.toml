[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "folded-debias"
# The version lives in one place, folded_debias.__version__.
dynamic = ["version"]
description = "Folded-normal debiasing of the low-CNR truncation-at-zero bias in bounded width fits (e.g. MSD diffusion)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Joseph J. Thiebes", email = "joseph@thiebes.org" },
]
# A library's metadata carries compatible ranges; the exact, hashed versions
# that produced the committed results are in uv.lock.
dependencies = [
    "numpy>=1.24,<3",
    "scipy>=1.10,<2",
]

[project.optional-dependencies]
# fft-cnr supplies per-frame CNR estimates from single 1-D profiles.
# Used for real experimental data; the Monte Carlo validation knows true CNR.
# The real-data pipeline needs fft-cnr's refusal of degenerate
# generalized-Gaussian fits (commit 69cd361, first released after 0.3.1);
# raise this bound to that release when it is published. uv.lock pins the
# commit through [tool.uv.sources] below.
cnr = ["fft-cnr>=0.3.1,<0.5"]
# curved-text draws the curved data-series label on the poster figure.
plot = ["matplotlib>=3.7,<4", "curved-text>=0.5,<1"]
dev = ["pytest>=7.4", "matplotlib>=3.7,<4", "fft-cnr>=0.3.1,<0.5",
       "curved-text>=0.5,<1"]

[tool.setuptools.dynamic]
version = { attr = "folded_debias.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
# Lock-only constraints: the environment that produced the committed results
# and poster figures. They do not enter the published metadata.
constraint-dependencies = [
    "numpy==2.4.5",
    "scipy==1.17.1",
    "matplotlib==3.10.9",
    "curved-text==0.5.0",
]

[tool.uv.sources]
# Development and the committed lock use the fft-cnr commit with the
# degenerate-fit refusal; published metadata keeps the PyPI range above.
fft-cnr = { git = "https://github.com/thiebes/fft-cnr", rev = "69cd3610e677e6d9c9fc78a17d7b0f28e9cdb9b9" }

[tool.pytest.ini_options]
testpaths = ["tests"]
